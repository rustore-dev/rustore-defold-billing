ext {
    rustore_billingclient_version = '10.3.1'
    rustore_core_version = rustore_billingclient_version
    sdk_version_code = 100301

    rustore_example_folder = "${rootProject.projectDir}/../billing_example"
    rustore_sdk_build_variant = 'release'
    repository = 'https://artifactory-external.vkpartner.ru/artifactory/maven-rustore-exposed'
}
buildscript {
    ext.kotlin_version = "1.9.25"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url = uri(repository)
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
